<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mosques in Oman</title>
    <style>
        body {
            margin: 0;
            overflow: hidden; /* Hide scrollbars if any */
        }
        iframe {
            border: none;
            width: 100vw;
            height: 100vh;
            display: block; /* Remove extra space below iframe */
        }
    </style>
  
    
    <meta name="theme-color" content="#2196f3">
    <link rel="manifest" href="/my-pwa-apps/mosquesui/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="/my-pwa-apps/mosquesui/icons/icon-192x192.png">
</head>
<body>

<iframe src="https://masjid-app.yabaggi.workers.dev/">
    </iframe>


    <script>
        // PWA Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/my-pwa-apps/mosquesui/sw.js', { scope: '/my-pwa-apps/mosquesui/' })
                    .then(registration => {
                        console.log('[PWA] Service Worker registered:', registration.scope);
                    })
                    .catch(error => {
                        console.error('[PWA] Service Worker registration failed:', error);
                    });
            });
        }

        // PWA Install Prompt
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            console.log('[PWA] App can be installed');
        });

        // Call this function from a custom install button in your UI
        async function installPWA() {
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            console.log('[PWA] Install prompt outcome:', outcome);
            deferredPrompt = null;
        }

        window.addEventListener('appinstalled', () => {
            console.log('[PWA] App installed successfully');
            deferredPrompt = null;
        });
    </script>
</body>

</html>
