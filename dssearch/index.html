<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>dspower-search — find the right dataset</title>
<meta name="theme-color" content="#12232E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+Arabic:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --ink:#12232E; --ink-2:#1B3140; --ink-3:#24404F;
    --parchment:#F3E9D6; --copper:#C1793A; --copper-dark:#9C5F2C;
    --sage:#7C9C86; --brick:#B1503F; --ink-text:#EDE6D6; --dim-text:#A9BAC2;
    --dark-text:#26211A; --card-radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--ink);color:var(--ink-text);font-family:'Inter',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;}
  h1,h2,h3,.display{font-family:'Fraunces',serif;}
  .mono{font-family:'JetBrains Mono',monospace;}

  header{
    padding:28px 20px 18px;border-bottom:1px solid rgba(255,255,255,0.08);
    display:flex;justify-content:space-between;align-items:flex-start;gap:16px;
    background:radial-gradient(1200px 300px at 20% -40%, rgba(193,121,58,0.18), transparent 60%), var(--ink);
  }
  .brand h1{font-size:clamp(24px,4vw,34px);margin:0 0 4px;letter-spacing:-0.01em;font-weight:700;}
  .brand h1 span{color:var(--copper);}
  .brand p{margin:0;color:var(--dim-text);font-size:14px;max-width:52ch;}
  .lang-toggle{display:flex;gap:6px;background:var(--ink-2);padding:4px;border-radius:999px;border:1px solid rgba(255,255,255,0.08);flex-shrink:0;}
  .lang-toggle button{border:none;background:transparent;color:var(--dim-text);padding:7px 14px;border-radius:999px;font-size:13px;font-family:'JetBrains Mono',monospace;cursor:pointer;transition:.15s;}
  .lang-toggle button.active{background:var(--copper);color:var(--ink);font-weight:700;}

  main{max-width:1180px;margin:0 auto;padding:24px 20px 80px;}

  .panel{background:var(--ink-2);border:1px solid rgba(255,255,255,0.07);border-radius:18px;padding:22px;margin-bottom:22px;}
  .panel h2{margin:0 0 4px;font-size:19px;}
  .panel .sub{color:var(--dim-text);font-size:13px;margin:0 0 16px;}

  .source-tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
  .source-tab{
    flex:1;min-width:120px;background:var(--ink-3);border:1px solid rgba(255,255,255,0.1);color:var(--ink-text);
    padding:10px 12px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:600;text-align:center;transition:.12s;
  }
  .source-tab.active{background:var(--copper);border-color:var(--copper);color:var(--ink);}
  .source-note{font-size:11.5px;color:var(--dim-text);margin:-10px 0 16px;}

  .searchrow{display:flex;gap:10px;margin-bottom:18px;}
  .searchrow input[type=text]{flex:1;background:var(--ink-3);border:1px solid rgba(255,255,255,0.1);color:var(--ink-text);padding:13px 16px;border-radius:10px;font-size:15px;font-family:'Inter',sans-serif;}
  .searchrow input[type=text]:focus{outline:2px solid var(--copper);outline-offset:1px;}
  .searchrow button{background:var(--copper);color:var(--ink);border:none;padding:0 22px;border-radius:10px;font-weight:600;cursor:pointer;font-size:15px;transition:.15s;}
  .searchrow button:hover{background:var(--copper-dark);color:var(--ink-text);}
  .searchrow button:focus-visible,.chip:focus-visible,.lang-toggle button:focus-visible,.source-tab:focus-visible{outline:2px solid var(--sage);outline-offset:2px;}

  .facet-group{margin-bottom:16px;}
  .facet-group.hidden{display:none;}
  .facet-label{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim-text);margin-bottom:8px;display:block;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{background:var(--ink-3);border:1px solid rgba(255,255,255,0.1);color:var(--ink-text);padding:7px 13px;border-radius:999px;font-size:13px;cursor:pointer;transition:.12s;user-select:none;}
  .chip:hover{border-color:var(--copper);}
  .chip.active{background:var(--copper);border-color:var(--copper);color:var(--ink);font-weight:600;}

  .checkrow{display:flex;align-items:center;gap:8px;margin-top:4px;}
  .checkrow label{font-size:13px;color:var(--dim-text);cursor:pointer;}

  .status{color:var(--dim-text);font-size:13px;margin:10px 0;min-height:18px;}
  .status.err{color:var(--brick);}

  .setup-msg{background:var(--ink-3);border:1px dashed var(--copper);border-radius:12px;padding:16px;font-size:13px;color:var(--ink-text);line-height:1.6;}
  .setup-msg code{background:rgba(0,0,0,0.3);padding:2px 6px;border-radius:5px;font-family:'JetBrains Mono',monospace;font-size:12px;}

  .results{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px;}

  .card{background:var(--parchment);color:var(--dark-text);border-radius:var(--card-radius);padding:16px 16px 14px;position:relative;box-shadow:0 6px 16px rgba(0,0,0,0.25);display:flex;flex-direction:column;gap:10px;}
  .card .tab{position:absolute;top:-9px;left:16px;background:var(--copper);color:var(--ink);font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;padding:2px 8px;border-radius:5px;letter-spacing:.05em;}
  .card .src-tab{position:absolute;top:-9px;right:16px;background:var(--ink);color:var(--parchment);font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;padding:2px 8px;border-radius:5px;letter-spacing:.05em;}
  [dir="rtl"] .card .tab{left:auto;right:16px;}
  [dir="rtl"] .card .src-tab{right:auto;left:16px;}
  .card-top{display:flex;gap:12px;align-items:flex-start;}
  .dial{flex-shrink:0;width:56px;height:56px;position:relative;}
  .dial svg{transform:rotate(-90deg);}
  .dial .score-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:15px;}
  .card-title{flex:1;min-width:0;}
  .card-title a{font-family:'Fraunces',serif;font-weight:600;font-size:16px;color:var(--dark-text);text-decoration:none;word-break:break-word;line-height:1.25;}
  .card-title a:hover{color:var(--copper-dark);text-decoration:underline;}
  .verdict-line{font-size:12px;font-weight:600;margin-top:3px;font-family:'JetBrains Mono',monospace;}

  .badges{display:flex;flex-wrap:wrap;gap:6px;}
  .badge{font-size:11px;padding:3px 8px;border-radius:6px;font-family:'JetBrains Mono',monospace;background:rgba(0,0,0,0.06);}
  .badge.license-permissive{background:rgba(124,156,134,0.25);color:#3f5c47;}
  .badge.license-restrictive{background:rgba(177,80,63,0.2);color:#7a3226;}
  .badge.license-unclear{background:rgba(0,0,0,0.08);color:#55524a;}
  .badge.flag{background:rgba(177,80,63,0.25);color:#7a3226;font-weight:700;}

  .stats-row{display:flex;gap:14px;font-size:12px;color:#5c574c;font-family:'JetBrains Mono',monospace;}

  .card-actions{display:flex;gap:8px;margin-top:2px;align-items:center;flex-wrap:wrap;}
  .card-actions button{flex:1;min-width:90px;font-size:11.5px;padding:7px 8px;border-radius:7px;border:1px solid rgba(0,0,0,0.15);background:transparent;color:var(--dark-text);cursor:pointer;font-family:'JetBrains Mono',monospace;}
  .card-actions button:hover{background:rgba(0,0,0,0.06);}
  .card-actions button.primary{background:var(--copper);color:var(--ink);border-color:var(--copper);font-weight:700;}
  .card-actions label{display:flex;align-items:center;font-size:11.5px;gap:4px;cursor:pointer;white-space:nowrap;}

  .compare-bar{position:sticky;bottom:14px;margin-top:18px;background:var(--ink-2);border:1px solid var(--copper);padding:12px 16px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px;flex-wrap:wrap;}
  .compare-bar button{background:var(--copper);color:var(--ink);border:none;padding:8px 14px;border-radius:8px;font-weight:600;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:12px;}
  .compare-bar .cmd{color:var(--ink-text);}

  details.glossary{background:var(--ink-2);border:1px solid rgba(255,255,255,0.07);border-radius:18px;padding:0;margin-bottom:22px;overflow:hidden;}
  details.glossary summary{cursor:pointer;padding:18px 22px;font-family:'Fraunces',serif;font-size:18px;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center;}
  details.glossary summary::-webkit-details-marker{display:none;}
  details.glossary summary::after{content:'+';color:var(--copper);font-size:20px;}
  details.glossary[open] summary::after{content:'–';}
  .glossary-body{padding:0 22px 22px;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px;}
  .glossary-col h3{font-size:14px;color:var(--copper);margin:0 0 10px;font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.05em;}
  .glossary-col dl{margin:0;}
  .glossary-col dt{font-weight:600;font-size:13.5px;margin-top:10px;color:var(--ink-text);}
  .glossary-col dd{margin:2px 0 0;font-size:12.5px;color:var(--dim-text);line-height:1.5;}

  .empty{color:var(--dim-text);text-align:center;padding:40px 10px;font-size:14px;}
  footer{text-align:center;color:var(--dim-text);font-size:12px;padding:20px;opacity:.7;}

  /* ===== Modal / file browser ===== */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,0.65);display:flex;align-items:center;justify-content:center;
    padding:16px;z-index:100;
  }
  .modal-panel{
    background:var(--ink-2);border:1px solid rgba(255,255,255,0.08);border-radius:16px;
    width:min(760px,100%);max-height:88vh;display:flex;flex-direction:column;overflow:hidden;
  }
  .modal-header{padding:16px 20px;border-bottom:1px solid rgba(255,255,255,0.08);display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
  .modal-breadcrumb{font-size:11px;color:var(--dim-text);text-transform:uppercase;letter-spacing:.05em;}
  .modal-header h3{margin:4px 0 0;font-size:17px;word-break:break-word;}
  .modal-close{background:transparent;border:1px solid rgba(255,255,255,0.15);color:var(--ink-text);border-radius:8px;width:32px;height:32px;cursor:pointer;font-size:14px;flex-shrink:0;}
  .modal-close:hover{border-color:var(--copper);color:var(--copper);}
  .modal-body{padding:16px 20px;overflow-y:auto;flex:1;}

  .file-row{
    display:flex;align-items:center;gap:10px;padding:10px 8px;border-radius:8px;cursor:pointer;
    color:var(--ink-text);font-size:13.5px;border-bottom:1px solid rgba(255,255,255,0.05);
  }
  .file-row:hover{background:var(--ink-3);}
  .file-icon{flex-shrink:0;width:22px;text-align:center;}
  .file-name{flex:1;min-width:0;word-break:break-all;font-family:'JetBrains Mono',monospace;font-size:12.5px;}
  .file-size{flex-shrink:0;font-size:11px;color:var(--dim-text);font-family:'JetBrains Mono',monospace;}

  .preview-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
  .preview-actions button{
    background:var(--copper);color:var(--ink);border:none;padding:8px 14px;border-radius:8px;
    font-weight:600;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:12px;
  }
  .preview-note{font-size:12px;color:var(--dim-text);margin-bottom:10px;line-height:1.5;}
  .preview-pre{
    background:var(--ink-3);padding:14px;border-radius:10px;white-space:pre-wrap;word-break:break-word;
    font-family:'JetBrains Mono',monospace;font-size:12.5px;max-height:52vh;overflow:auto;margin:0;
  }
  .preview-pre.arabic-content{font-family:'Noto Sans Arabic','JetBrains Mono',monospace;font-size:14px;line-height:1.9;}
  .preview-table-wrap{max-height:52vh;overflow:auto;border-radius:10px;border:1px solid rgba(255,255,255,0.08);}
  table.preview-table{border-collapse:collapse;width:100%;font-size:12.5px;background:var(--parchment);color:var(--dark-text);}
  table.preview-table th,table.preview-table td{padding:7px 10px;border-bottom:1px solid rgba(0,0,0,0.08);text-align:left;vertical-align:top;max-width:280px;}
  table.preview-table.arabic-content th,table.preview-table.arabic-content td{font-family:'Noto Sans Arabic',sans-serif;font-size:13.5px;text-align:right;}
  table.preview-table th{background:rgba(0,0,0,0.05);font-family:'JetBrains Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.03em;position:sticky;top:0;}
  .loading-line{color:var(--dim-text);font-size:13px;padding:20px 0;text-align:center;}

  .advisor-head{display:flex;gap:16px;align-items:center;margin-bottom:14px;}
  .advisor-head .dial{width:72px;height:72px;}
  .advisor-head .dial .score-num{font-size:19px;}
  .advisor-verdict-name{font-family:'Fraunces',serif;font-weight:700;font-size:19px;}
  .advisor-meta{font-size:12px;color:var(--dim-text);margin-top:2px;}
  .advisor-section{margin-top:14px;}
  .advisor-section h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--copper);font-family:'JetBrains Mono',monospace;}
  .advisor-list{margin:0;padding:0;list-style:none;font-size:13px;line-height:1.6;}
  .advisor-list li{padding-left:18px;position:relative;margin-bottom:4px;}
  .advisor-list.for li::before{content:'+';color:var(--sage);position:absolute;left:0;font-weight:700;}
  .advisor-list.against li::before{content:'–';color:var(--brick);position:absolute;left:0;font-weight:700;}
  [dir="rtl"] .advisor-list li{padding-left:0;padding-right:18px;}
  [dir="rtl"] .advisor-list.for li::before,[dir="rtl"] .advisor-list.against li::before{left:auto;right:0;}
  .advisor-bottomline{background:var(--ink-3);border-radius:10px;padding:12px 14px;font-size:13px;margin-top:6px;}
  .compare-columns{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media (max-width:560px){.compare-columns{grid-template-columns:1fr;}}
  .compare-col{background:var(--ink-3);border-radius:12px;padding:14px;}
  .compare-col h4{margin:0 0 6px;font-size:13.5px;word-break:break-word;}
  .pick-banner{background:var(--copper);color:var(--ink);border-radius:10px;padding:12px 14px;font-weight:700;font-size:13.5px;margin-top:14px;}

  @media (max-width:640px){header{flex-direction:column;}.searchrow{flex-direction:column;}.searchrow button{padding:12px;}}
  @media (prefers-reduced-motion: reduce){*{transition:none !important;}}
</style>
    <link rel="manifest" href="/dssearch/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="/dssearch/icons/icon-192x192.png">
</head>
<body>

<header>
  <div class="brand">
    <h1 id="titleText">dspower<span>search</span></h1>
    <p id="taglineText"></p>
  </div>
  <div class="lang-toggle">
    <button id="btnEn" class="active" onclick="setLang('en')">EN</button>
    <button id="btnAr" onclick="setLang('ar')">AR</button>
  </div>
</header>

<main>

  <section class="panel">
    <h2 id="guideTitle"></h2>
    <p class="sub" id="guideSub"></p>

    <div class="source-tabs" id="sourceTabs"></div>
    <p class="source-note" id="sourceNote"></p>

    <div class="searchrow">
      <input type="text" id="searchInput">
      <button onclick="doSearch()" id="searchBtn"></button>
    </div>

    <div class="facet-group" id="facetType">
      <span class="facet-label" id="labelType"></span>
      <div class="chips" id="chipsType"></div>
    </div>

    <div class="facet-group" id="facetSize">
      <span class="facet-label" id="labelSize"></span>
      <div class="chips" id="chipsSize"></div>
    </div>

    <div class="facet-group" id="facetLang">
      <span class="facet-label" id="labelLang"></span>
      <div class="chips" id="chipsLang"></div>
    </div>

    <div class="checkrow">
      <input type="checkbox" id="permissiveOnly">
      <label for="permissiveOnly" id="labelPermissive"></label>
    </div>

    <div class="status" id="statusLine"></div>
  </section>

  <details class="glossary">
    <summary id="glossarySummary"></summary>
    <div class="glossary-body" id="glossaryBody"></div>
  </details>

  <section>
    <div class="results" id="results"></div>
  </section>

  <div class="compare-bar" id="compareBar" style="display:none;">
    <span id="compareLabel"></span>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
      <span class="cmd mono" id="compareCmd"></span>
      <button onclick="runComparison()" id="runComparisonBtn" style="display:none;"></button>
      <button onclick="copyCompare()" id="copyCompareBtn"></button>
    </div>
  </div>

</main>

<footer id="footerText"></footer>

<!-- ===== File browser / preview modal ===== -->
<div id="modalOverlay" class="modal-overlay" style="display:none;" onclick="if(event.target===this) closeModal()">
  <div class="modal-panel">
    <div class="modal-header">
      <div>
        <div class="modal-breadcrumb mono" id="modalBreadcrumb"></div>
        <h3 id="modalTitle"></h3>
      </div>
      <button class="modal-close" onclick="closeModal()" id="modalCloseBtn">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
/* =========================================================
   CONFIG
   ========================================================= */
const KAGGLE_PROXY_URL = "https://hfpower-kaggle-proxy.yabaggi.workers.dev"; // e.g. "https://dspower-kaggle-proxy.yoursubdomain.workers.dev"
const PREVIEW_BYTE_LIMIT = 300000; // ~300KB preview cap per file
const ADVISOR_BYTE_LIMIT = 1500000; // ~1.5MB sample cap for the in-browser advisor run

/* =========================================================
   I18N
   ========================================================= */
const STR = {

    // file browser strings
    filesBreadcrumb:"Files",
    contentBreadcrumb:n=>`Files / ${n}`,
    loadingFiles:"Loading file list…",
    loadingContent:"Loading file…",
    noFiles:"No files found in this repository.",
    backToFiles:"⟵ Back to files",
    truncatedNote:"Showing a preview only — this file is larger than what's shown here. Use the download command below for the full file.",
    binaryNote:"This is a binary/columnar file and can't be previewed in the browser.",
    fetchFileErr:"Couldn't load this file.",

/* =========================================================
   LICENSE CLASSIFICATION (shared across sources)
   ========================================================= */
const PERMISSIVE = new Set(["mit","apache-2.0","apache2.0","bsd","bsd-3-clause","cc0-1.0","cc-by-4.0","cc-by-3.0","unlicense","openrail","cc0"]);
const RESTRICTIVE_HINTS = ["nc","nd","gpl","research","proprietary","other"];

function classifyLicense(lic){
  const l = (lic||"").toLowerCase().trim();
  if (PERMISSIVE.has(l)) return "permissive";
  if (l.includes("cc0") || l.includes("public domain") || l === "mit" || l.includes("apache")) return "permissive";
  if (!l || l === "unknown" || l === "noassertion") return "unclear";
  if (RESTRICTIVE_HINTS.some(h => l.includes(h))) return "restrictive";
  return "unclear";
}

function extractTagValue(tags, prefix){
  const t = (tags||[]).find(t => t.startsWith(prefix+":"));
  return t ? t.slice(prefix.length+1) : null;
}

function formatBytes(bytes){
  if (!bytes) return null;
  const units = ["B","KB","MB","GB","TB"];
  let i = 0, n = bytes;
  while (n >= 1024 && i < units.length-1){ n/=1024; i++; }
  return `${n.toFixed(n<10?1:0)} ${units[i]}`;
}

function looksArabic(text){
  const sample = (text||"").slice(0, 2000);
  const arabicChars = (sample.match(/[\u0600-\u06FF]/g) || []).length;
  const letters = (sample.match(/[^\s\d.,;:!?()\[\]{}'"-]/g) || []).length;
  return letters > 0 && (arabicChars / letters) > 0.3;
}

/* =========================================================
   NORMALIZATION
   ========================================================= */
function normalizeHF(ds){
  const tags = ds.tags || [];
  const license = extractTagValue(tags, "license") || ds.cardData?.license || "unknown";
  return {
    source:'hf', id: ds.id, url:`https://huggingface.co/datasets/${ds.id}`, title: ds.id,
    a: ds.downloads||0, b: ds.likes||0,
    license, category: extractTagValue(tags,"task_categories"),
    sizeLabel: extractTagValue(tags,"size_categories"),
    flagKey: ds.gated ? 'gated' : null,
  };
}
function normalizeGitHub(repo){
  return {
    source:'github', id: repo.full_name, url: repo.html_url, title: repo.full_name,
    a: repo.stargazers_count||0, b: repo.forks_count||0,
    license: repo.license?.spdx_id || "unknown",
    category: repo.language || null,
    sizeLabel: repo.size ? formatBytes(repo.size*1024) : null,
    flagKey: repo.archived ? 'archived' : null,
  };
}
function normalizeKaggle(ds){
  return {
    source:'kaggle', id: ds.ref, url:`https://www.kaggle.com/datasets/${ds.ref}`, title: ds.title || ds.ref,
    a: ds.downloadCount||0, b: ds.voteCount||0,
    license: ds.licenseName || "unknown",
    category: (ds.tags && ds.tags[0] && (ds.tags[0].name||ds.tags[0])) || null,
    sizeLabel: formatBytes(ds.totalBytes),
    flagKey: null,
    usability: typeof ds.usabilityRating === "number" ? ds.usabilityRating : null,
  };
}

/* =========================================================
   SCORING
   ========================================================= */
function scoreItem(n){
  const licenseClass = classifyLicense(n.license);
  let score = 0;
  score += licenseClass === "permissive" ? 30 : (licenseClass === "unclear" ? 15 : 0);
  score += (n.a >= 10000 || n.b >= 100) ? 25 : ((n.a >= 1000 || n.b >= 20) ? 12 : 0);
  score += n.category ? 20 : 0;
  score += n.sizeLabel ? 15 : 0;
  score += n.flagKey ? -10 : 10;
  if (typeof n.usability === "number") score += n.usability >= 0.7 ? 10 : (n.usability >= 0.4 ? 4 : -5);
  score = Math.max(0, Math.min(100, score));
  const verdict = score >= 70 ? "use" : (score >= 45 ? "caution" : "avoid");
  return {...n, licenseClass, score, verdict};
}

/* =========================================================
   SEARCH
   ========================================================= */
async function searchHF(keyword){
  const S = STR[lang];
  const typeObj = S.types.find(t => t.key === selType);
  const sizeObj = S.sizes.find(t => t.key === selSize);
  const langObj = S.langs.find(t => t.key === selLang);
  const searchTerms = [keyword, typeObj.keyword, langObj.keyword].filter(Boolean).join(" ");
  const filters = [typeObj.filter, sizeObj.filter, langObj.filter].filter(Boolean);
  const params = new URLSearchParams();
  if (searchTerms) params.set("search", searchTerms);
  filters.forEach(f => params.append("filter", f));
  params.set("sort", "downloads"); params.set("direction", "-1");
  params.set("limit", "30"); params.set("full", "true");
  const res = await fetch(`https://huggingface.co/api/datasets?${params.toString()}`);
  if (!res.ok) throw new Error("HTTP " + res.status);
  const data = await res.json();
  return (Array.isArray(data) ? data : []).map(normalizeHF);
}
async function searchGitHub(keyword){
  const S = STR[lang];

  const params = new URLSearchParams();

  const res = await fetch(`https://api.github.com/search/repositories?${params.toString()}`);
  if (!res.ok) throw new Error("HTTP " + res.status);
  const data = await res.json();
  return (data.items || []).map(normalizeGitHub);
}
async function searchKaggle(keyword){

function scoreColor(score){ if (score >= 70) return "#7C9C86"; if (score >= 45) return "#C1793A"; return "#B1503F"; }
function dialSvg(score){
  const r = 24, c = 2*Math.PI*r; const offset = c - (score/100)*c; const color = scoreColor(score);
  return `<svg width="56" height="56" viewBox="0 0 56 56">
    <circle cx="28" cy="28" r="${r}" fill="none" stroke="rgba(0,0,0,0.1)" stroke-width="5"/>
    <circle cx="28" cy="28" r="${r}" fill="none" stroke="${color}" stroke-width="5"
      stroke-dasharray="${c}" stroke-dashoffset="${offset}" stroke-linecap="round"/>
  </svg>`;
}

async function openFileBrowser(src, id){
  const S = STR[lang];

  document.getElementById("modalTitle").textContent = id;

  openModal();

  try {
    if (src === 'hf') {
      const res = await fetch(`https://huggingface.co/api/datasets/${id}?full=true`);
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      modalCtx.files = (data.siblings || []).map(s => ({ path: s.rfilename, size: s.size || null }));
    } else if (src === 'github') {
      const repoRes = await fetch(`https://api.github.com/repos/${id}`);
      if (!repoRes.ok) throw new Error("HTTP " + repoRes.status);
      const repoData = await repoRes.json();
      modalCtx.branch = repoData.default_branch || 'main';
      const treeRes = await fetch(`https://api.github.com/repos/${id}/git/trees/${modalCtx.branch}?recursive=1`);
      if (!treeRes.ok) throw new Error("HTTP " + treeRes.status);
      const treeData = await treeRes.json();
      modalCtx.files = (treeData.tree || []).filter(t => t.type === 'blob').map(t => ({ path: t.path, size: t.size || null }));
    } else {
      if (!KAGGLE_PROXY_URL) {
        document.getElementById("modalBody").innerHTML = `<div class="setup-msg">${S.kaggleSetupMsg}</div>`;

      const datasetSlug = rest.join('/');

      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      // Kaggle's file-list shape isn't fully documented publicly — probe common key names defensively.
      const rawFiles = data.datasetFiles || data.files || (Array.isArray(data) ? data : []);
      modalCtx.files = rawFiles.map(f => ({
        path: f.name || f.fileName || f.ref || f.path,
        size: f.totalBytes || f.size || null,
      })).filter(f => f.path);
    }

function renderFileContent(ext, text, truncated){
  const S = STR[lang];
  const container = document.getElementById("previewContent");
  const isArabic = looksArabic(text);
  const note = truncated ? `<div class="preview-note">${S.truncatedNote}</div>` : "";

  if ((ext === 'csv' || ext === 'tsv') && window.Papa) {
    try {
      const parsed = Papa.parse(text, { header: true, skipEmptyLines: true, delimiter: ext === 'tsv' ? '\t' : ',' });
      let rows = parsed.data;
      if (truncated && rows.length) rows = rows.slice(0, -1);
      if (!rows.length) throw new Error("empty");
      const cols = Object.keys(rows[0]).slice(0, 8);
      let html = `<table class="preview-table${isArabic?' arabic-content':''}"><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>`;
      rows.slice(0, 100).forEach(r => {
        html += `<tr>${cols.map(c => `<td>${String(r[c] ?? '').slice(0,300)}</td>`).join('')}</tr>`;
      });
      html += `</tbody></table>`;
      container.innerHTML = note + `<div class="preview-table-wrap">${html}</div>`;
      return;
    } catch (e) { /* fall through to raw text */ }
  }

  if (ext === 'jsonl') {
    const lines = text.split(/\r?\n/).filter(Boolean);
    const usableLines = truncated ? lines.slice(0, -1) : lines;
    const rows = [];
    for (const ln of usableLines) { try { rows.push(JSON.parse(ln)); } catch(e){} if (rows.length >= 100) break; }
    if (rows.length) {
      const cols = Object.keys(rows[0]).slice(0, 8);
      let html = `<table class="preview-table${isArabic?' arabic-content':''}"><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>`;
      rows.forEach(r => { html += `<tr>${cols.map(c => `<td>${String(r[c] ?? '').slice(0,300)}</td>`).join('')}</tr>`; });
      html += `</tbody></table>`;
      container.innerHTML = note + `<div class="preview-table-wrap">${html}</div>`;
      return;
    }
  }

  if (ext === 'json' && !truncated) {
    try {
      const obj = JSON.parse(text);
      container.innerHTML = note + `<pre class="preview-pre${isArabic?' arabic-content':''}" dir="auto">${escapeHtml(JSON.stringify(obj, null, 2))}</pre>`;
      return;
    } catch (e) { /* fall through */ }
  }

  container.innerHTML = note + `<pre class="preview-pre${isArabic?' arabic-content':''}" dir="auto">${escapeHtml(text)}</pre>`;
}

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* =========================================================
   IN-BROWSER ADVISOR — mirrors hf_advisor.sh's logic, generalized
   across sources (HF/GitHub/Kaggle)
   ========================================================= */
const ADVISOR_TEXT_EXT = ['parquet','jsonl','json','csv'];

function findResultById(src, id){
  return lastResults.find(r => r.source === src && r.id === id) || null;
}

function pickAdvisorFile(src, files){
  // files: array of {path, size}
  if (src === 'hf') {
    const langPref = (selLang !== 'any') ? selLang : 'en';
    const picked = files.find(f => f.path.includes(`.${langPref}/`) && ADVISOR_TEXT_EXT.some(e => f.path.endsWith('.'+e)));
    if (picked) return picked.path;
  }
  const generic = files.find(f => ADVISOR_TEXT_EXT.some(e => f.path.endsWith('.'+e)));
  return generic ? generic.path : null;
}

function classifyDtype(cols){
  const set = new Set(cols.map(c => c.toLowerCase()));
  if (set.has('instruction') && set.has('output')) return 'Instruction Tuning';
  if (set.has('question') && set.has('answer')) return 'Question Answering';
  if (set.has('text')) return 'Text Corpus';
  return 'Unknown';
}
function findTextColumn(cols){
  const pref = ['text','content','body','instruction','question','prompt'];
  const lower = cols.map(c => c.toLowerCase());
  for (const p of pref){ const idx = lower.indexOf(p); if (idx !== -1) return cols[idx]; }
  return null;
}

function computeAdvisorFromRows(rows){
  if (!rows.length) return null;
  const cols = Object.keys(rows[0]);
  const dtype = classifyDtype(cols);
  const textCol = findTextColumn(cols);
  let missingCount = 0, nested = false;
  rows.forEach(r => {
    cols.forEach(c => {
      const v = r[c];
      if (v === null || v === undefined || v === "") missingCount++;
      if (v && typeof v === "object") nested = true;
    });
  });
  const missingRatio = missingCount / (rows.length * cols.length);
  return { rows: rows.length, cols: cols.length, columns: cols, dtype, textCol, missingRatio, nested };
}

// meta: { license, a, b, category }  — a/b are the source's two popularity stats
// statLabels: { a: 'downloads'|'stars'|..., b: 'likes'|'forks'|'votes' }
function buildAdvisorVerdict(facts, meta, statLabels){
  const licenseClass = classifyLicense(meta.license);
  const reasonsFor = [], reasonsAgainst = [];

  if (facts.dtype !== 'Unknown') reasonsFor.push(`Clear structure detected (${facts.dtype}).`);
  else reasonsAgainst.push(`Schema doesn't match a recognizable pattern (columns: ${facts.columns.slice(0,6).join(', ')}).`);

  if (facts.rows >= 10000) reasonsFor.push(`Good sample volume: ${facts.rows.toLocaleString()} rows loaded.`);
  else if (facts.rows < 500) reasonsAgainst.push(`Small sample: only ${facts.rows.toLocaleString()} rows loaded from this file.`);

  if (facts.missingRatio < 0.02) reasonsFor.push('Very few missing values in the sample.');
  else if (facts.missingRatio > 0.15) reasonsAgainst.push(`~${(facts.missingRatio*100).toFixed(0)}% missing values in the sample.`);

  if (licenseClass === 'permissive') reasonsFor.push('Permissive license — free for commercial + research use.');
  else if (licenseClass === 'restrictive') reasonsAgainst.push(`License '${meta.license}' likely restricts commercial use or requires copyleft.`);
  else reasonsAgainst.push(`License unclear ('${meta.license}') — verify terms before shipping.`);

  if (meta.a >= 10000 || meta.b >= 100) reasonsFor.push(`Community-validated: ${meta.a.toLocaleString()} ${statLabels.a}, ${meta.b.toLocaleString()} ${statLabels.b}.`);
  else if (meta.a < 100 && meta.b < 5) reasonsAgainst.push(`Low adoption so far (${meta.a.toLocaleString()} ${statLabels.a}, ${meta.b.toLocaleString()} ${statLabels.b}).`);

  if (facts.nested) reasonsAgainst.push('Contains nested (object/array) values — needs flattening before most pipelines can use it.');
  if (meta.category) reasonsFor.push(`Declared category/topic: ${meta.category}`);

  let score = 0;
  score += facts.dtype !== 'Unknown' ? 25 : 0;
  score += facts.rows >= 10000 ? 20 : (facts.rows < 500 ? 0 : 10);
  score += facts.missingRatio < 0.02 ? 15 : (facts.missingRatio > 0.15 ? 0 : 8);
  score += licenseClass === 'permissive' ? 25 : (licenseClass === 'restrictive' ? 0 : 10);
  score += (meta.a >= 10000 || meta.b >= 100) ? 15 : 5;
  score = Math.max(0, Math.min(100, score));
  const verdict = score >= 70 ? 'use' : (score >= 45 ? 'caution' : 'avoid');

  return { score, verdict, licenseClass, reasonsFor, reasonsAgainst };
}

// Fallback when no analyzable data file exists (common for GitHub code repos) —
// score from search-result metadata alone, same weights as the card list view.
function buildShallowFallback(src, id, ctx){
  const n = { source: src, id, a: ctx.a, b: ctx.b, license: ctx.license, category: ctx.category, sizeLabel: null, flagKey: null };
  const scored = scoreItem(n);
  const statLabels = STR[lang].statLabels[src];
  const reasonsFor = [], reasonsAgainst = [];
  if (scored.licenseClass === 'permissive') reasonsFor.push('Permissive license — free for commercial + research use.');
  else if (scored.licenseClass === 'restrictive') reasonsAgainst.push(`License '${ctx.license}' likely restricts commercial use or requires copyleft.`);
  else reasonsAgainst.push(`License unclear ('${ctx.license}') — verify terms before shipping.`);
  if (ctx.a >= 10000 || ctx.b >= 100) reasonsFor.push(`Community-validated: ${ctx.a.toLocaleString()} ${statLabels.a}, ${ctx.b.toLocaleString()} ${statLabels.b}.`);
  else if (ctx.a < 100 && ctx.b < 5) reasonsAgainst.push(`Low adoption so far (${ctx.a.toLocaleString()} ${statLabels.a}, ${ctx.b.toLocaleString()} ${statLabels.b}).`);
  if (ctx.category) reasonsFor.push(`Declared category/topic: ${ctx.category}`);
  else reasonsAgainst.push('No declared category or topic found.');
  return { ...scored, reasonsFor, reasonsAgainst, shallow: true, id, src };
}

async function fetchAdvisorContext(src, id){
  if (src === 'hf') {
    const res = await fetch(`https://huggingface.co/api/datasets/${id}?full=true`);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    const tags = data.tags || [];
    return {
      license: extractTagValue(tags, "license") || data.cardData?.license || "unknown",
      a: data.downloads || 0, b: data.likes || 0,
      category: extractTagValue(tags, "task_categories"),
      files: (data.siblings || []).map(s => ({ path: s.rfilename, size: s.size || null })),
      branch: null,
    };
  }
  if (src === 'github') {
    const repoRes = await fetch(`https://api.github.com/repos/${id}`);
    if (!repoRes.ok) throw new Error("HTTP " + repoRes.status);
    const repoData = await repoRes.json();
    const branch = repoData.default_branch || 'main';
    const treeRes = await fetch(`https://api.github.com/repos/${id}/git/trees/${branch}?recursive=1`);
    if (!treeRes.ok) throw new Error("HTTP " + treeRes.status);
    const treeData = await treeRes.json();
    return {
      license: repoData.license?.spdx_id || "unknown",
      a: repoData.stargazers_count || 0, b: repoData.forks_count || 0,
      category: repoData.language || (repoData.topics && repoData.topics[0]) || null,
      files: (treeData.tree || []).filter(t => t.type === 'blob').map(t => ({ path: t.path, size: t.size || null })),
      branch,
    };
  }
  // kaggle
  if (!KAGGLE_PROXY_URL) return { needsProxySetup: true };
  const [owner, ...rest] = id.split('/');
  const datasetSlug = rest.join('/');
  const res = await fetch(`${KAGGLE_PROXY_URL}/files?owner=${encodeURIComponent(owner)}&dataset=${encodeURIComponent(datasetSlug)}`);
  if (!res.ok) throw new Error("HTTP " + res.status);
  const data = await res.json();
  const rawFiles = data.datasetFiles || data.files || (Array.isArray(data) ? data : []);
  const files = rawFiles.map(f => ({ path: f.name || f.fileName || f.ref || f.path, size: f.totalBytes || f.size || null })).filter(f => f.path);
  const known = findResultById(src, id);
  return {
    license: known?.license || "unknown",
    a: known?.a || 0, b: known?.b || 0,
    category: known?.category || null,
    files, branch: null,
  };
}

function buildRawUrl(src, id, branch, filePath){
  const enc = filePath.split('/').map(encodeURIComponent).join('/');
  if (src === 'hf') return `https://huggingface.co/datasets/${id}/resolve/main/${enc}`;
  if (src === 'github') return `https://raw.githubusercontent.com/${id}/${branch}/${enc}`;
  const [owner, ...rest] = id.split('/');
  const datasetSlug = rest.join('/');
  return `${KAGGLE_PROXY_URL}/download?owner=${encodeURIComponent(owner)}&dataset=${encodeURIComponent(datasetSlug)}&file=${encodeURIComponent(filePath)}`;
}

async function runAdvisorAnalysis(src, id){
  const ctx = await fetchAdvisorContext(src, id);
  if (ctx.needsProxySetup) return { needsProxySetup: true };

  const file = pickAdvisorFile(src, ctx.files);
  if (!file) return buildShallowFallback(src, id, ctx);
  if (file.endsWith('.parquet')) return { needsLocal: true, file, id, src };

  const url = buildRawUrl(src, id, ctx.branch, file);
  const res = await fetch(url, { headers: { Range: `bytes=0-${ADVISOR_BYTE_LIMIT}` } });
  if (!res.ok && res.status !== 206) throw new Error("HTTP " + res.status);
  let text = await res.text();
  const truncated = text.length >= ADVISOR_BYTE_LIMIT;
  if (truncated) text = text.slice(0, ADVISOR_BYTE_LIMIT);

  const ext = fileExt(file);
  let rows = [];
  if (ext === 'csv' || ext === 'tsv') {
    const parsed = Papa.parse(text, { header: true, skipEmptyLines: true, delimiter: ext === 'tsv' ? '\t' : ',' });
    rows = parsed.data;
    if (truncated && rows.length) rows = rows.slice(0, -1);
  } else if (ext === 'jsonl') {
    const lines = text.split(/\r?\n/).filter(Boolean);
    const usable = truncated ? lines.slice(0, -1) : lines;
    for (const ln of usable) { try { rows.push(JSON.parse(ln)); } catch(e){} }
  } else if (ext === 'json' && !truncated) {
    try { const obj = JSON.parse(text); rows = Array.isArray(obj) ? obj : [obj]; } catch(e){}
  }

  const facts = computeAdvisorFromRows(rows);
  if (!facts) return buildShallowFallback(src, id, ctx);

  const meta = { license: ctx.license, a: ctx.a, b: ctx.b, category: ctx.category };
  const statLabels = STR[lang].statLabels[src];
  const result = buildAdvisorVerdict(facts, meta, statLabels);
  return { ...result, facts, meta, file, id, src, truncated, statLabels };
}

function dialSvgBig(score){
  const r = 30, c = 2*Math.PI*r; const offset = c - (score/100)*c; const color = scoreColor(score);
  return `<svg width="72" height="72" viewBox="0 0 72 72" style="transform:rotate(-90deg);">
    <circle cx="36" cy="36" r="${r}" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="6"/>
    <circle cx="36" cy="36" r="${r}" fill="none" stroke="${color}" stroke-width="6"
      stroke-dasharray="${c}" stroke-dashoffset="${offset}" stroke-linecap="round"/>
  </svg>`;
}

function renderAdvisorPanel(r){
  const S = STR[lang];
  const body = document.getElementById("modalBody");

  if (r.needsProxySetup) {
    body.innerHTML = `<div class="setup-msg">${S.kaggleSetupMsg}</div>`;
    return;
  }
  if (r.needsLocal) {
    if (r.src === 'hf') {
      body.innerHTML = `
        <div class="setup-msg" style="margin-bottom:12px;">${S.advisorNeedsLocal(r.file)}</div>
        <div class="preview-actions"><button id="copyLocalAdvisorBtn">${S.copyAdvisor}</button></div>
      `;
      document.getElementById("copyLocalAdvisorBtn").onclick = (e) => {
        navigator.clipboard.writeText(`./hf_advisor.sh ${r.id}`).then(() => flashCopied(e.target));
      };
    } else {
      body.innerHTML = `<div class="setup-msg">${S.advisorNeedsLocal(r.file)}</div>`;
    }
    return;
  }

  const forList = r.reasonsFor.map(x => `<li>${x}</li>`).join('') || '<li>—</li>';
  const againstList = r.reasonsAgainst.map(x => `<li>${x}</li>`).join('') || '<li>—</li>';
  const metaLine = r.shallow ? S.advisorShallowNote : S.advisorSampleFile(r.file);
  const footNote = r.shallow ? '' : `<div class="preview-note" style="margin-top:12px;">${S.advisorSampleNote}</div>`;

  body.innerHTML = `
    <div class="advisor-head">
      <div class="dial">${dialSvgBig(r.score)}<div class="score-num" style="color:${scoreColor(r.score)}">${r.score}</div></div>
      <div>
        <div class="advisor-verdict-name" style="color:${scoreColor(r.score)}">${S.verdict[r.verdict]}</div>
        <div class="advisor-meta">${metaLine}</div>
      </div>
    </div>
    <div class="advisor-section">
      <h4>${S.reasonsForTitle}</h4>
      <ul class="advisor-list for">${forList}</ul>
    </div>
    <div class="advisor-section">
      <h4>${S.reasonsAgainstTitle}</h4>
      <ul class="advisor-list against">${againstList}</ul>
    </div>
    <div class="advisor-section">
      <h4>${S.bottomLine}</h4>
      <div class="advisor-bottomline">${S.bottomLines[r.verdict]}</div>
    </div>
    ${footNote}
  `;
}

async function runAdvisor(src, id){
  const S = STR[lang];
  document.getElementById("modalBreadcrumb").textContent = S.advisorBreadcrumb;
  document.getElementById("modalTitle").textContent = id;
  document.getElementById("modalBody").innerHTML = `<div class="loading-line">${S.advisorRunning}</div>`;
  openModal();
  try {
    const result = await runAdvisorAnalysis(src, id);
    renderAdvisorPanel(result);
  } catch (e) {
    document.getElementById("modalBody").innerHTML = `<div class="setup-msg">${S.fetchFileErr}</div>`;
  }
}

async function runComparison(){
  const pairs = [...compareSet].slice(0,2).map(k => k.split('::')); // [[src,id],[src,id]]
  if (pairs.length < 2) return;
  const S = STR[lang];
  document.getElementById("modalBreadcrumb").textContent = S.comparisonTitle;
  document.getElementById("modalTitle").textContent = `${pairs[0][1]} vs ${pairs[1][1]}`;
  document.getElementById("modalBody").innerHTML = `<div class="loading-line">${S.advisorRunning}</div>`;
  openModal();
  try {
    const [r1, r2] = await Promise.all([
      runAdvisorAnalysis(pairs[0][0], pairs[0][1]),
      runAdvisorAnalysis(pairs[1][0], pairs[1][1]),
    ]);
    renderComparisonPanel(pairs.map(p => p[1]), r1, r2);
  } catch (e) {
    document.getElementById("modalBody").innerHTML = `<div class="setup-msg">${S.fetchFileErr}</div>`;
  }
}

function statsOf(r){
  return r.meta ? { a: r.meta.a, b: r.meta.b } : { a: r.a || 0, b: r.b || 0 };
}

function miniAdvisorCol(id, r){
  const S = STR[lang];
  if (r.needsProxySetup) return `<div class="compare-col"><h4>${id}</h4><div class="preview-note">${S.kaggleSetupMsg}</div></div>`;
  if (r.needsLocal) return `<div class="compare-col"><h4>${id}</h4><div class="preview-note">${S.advisorNeedsLocal(r.file)}</div></div>`;
  const forList = r.reasonsFor.slice(0,4).map(x => `<li>${x}</li>`).join('') || '<li>—</li>';
  const againstList = r.reasonsAgainst.slice(0,4).map(x => `<li>${x}</li>`).join('') || '<li>—</li>';
  return `
    <div class="compare-col">
      <h4>${id}</h4>
      <div class="advisor-head" style="margin-bottom:10px;">
        <div class="dial" style="width:56px;height:56px;">${dialSvg(r.score)}<div class="score-num" style="color:${scoreColor(r.score)}">${r.score}</div></div>
        <div class="advisor-verdict-name" style="font-size:15px;color:${scoreColor(r.score)}">${S.verdict[r.verdict]}</div>
      </div>
      <ul class="advisor-list for">${forList}</ul>
      <ul class="advisor-list against">${againstList}</ul>
    </div>
  `;
}

function renderComparisonPanel(ids, r1, r2){
  const S = STR[lang];
  const body = document.getElementById("modalBody");
  let pick = null;
  if (!r1.needsProxySetup && !r2.needsProxySetup && !r1.needsLocal && !r2.needsLocal) {
    if (r1.score !== r2.score) pick = r1.score > r2.score ? ids[0] : ids[1];
    else if (r1.licenseClass === 'permissive' && r2.licenseClass !== 'permissive') pick = ids[0];
    else if (r2.licenseClass === 'permissive' && r1.licenseClass !== 'permissive') pick = ids[1];
    else { const s1 = statsOf(r1), s2 = statsOf(r2); pick = s1.a >= s2.a ? ids[0] : ids[1]; }
  }
  body.innerHTML = `
    <div class="compare-columns">
      ${miniAdvisorCol(ids[0], r1)}
      ${miniAdvisorCol(ids[1], r2)}
    </div>
    ${pick ? `<div class="pick-banner">${S.pickLabel(pick)}</div>` : ''}
  `;
}
