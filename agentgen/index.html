<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image to Assets App</title>
    <style>
        body {
            margin: 0;
            overflow: hidden; /* Hide scrollbars if any */
        }
        iframe {
            border: none;
            width: 100vw;
            height: 100vh;
            display: block; /* Remove extra space below iframe */
        }
    </style>
  
    <meta name="theme-color" content="#2196f3">
    <link rel="manifest" href="/agentgen/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">
</head>
<body>
    
    <iframe src="https://agent-gen-eight.vercel.app/">
    </iframe>


<script>if('serviceWorker' in navigator)window.addEventListener('load',()=>{navigator.serviceWorker.register('/agentgen/sw.js').then(r=>console.log('SW registered:',r)).catch(e=>console.error('SW registration failed:',e))})</script>
</body>
</html>
