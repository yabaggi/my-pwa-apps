<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Landing Page Generator</title>
<style>
  :root {
    --bg: #0f172a;
    --surface: #1e293b;
    --border: #334155;
    --primary: #3b82f6;
    --text: #f8fafc;
    --text-muted: #94a3b8;
  }
  
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
  }
  
  /* Main Layout */
  .app-container {
    display: grid;
    grid-template-columns: 350px 1fr;
    height: 100vh;
  }
  
  /* Sidebar */
  .sidebar {
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  
  .sidebar-header {
    padding: 20px;
    border-bottom: 1px solid var(--border);
  }
  
  .sidebar-header h1 {
    font-size: 18px;
    color: var(--primary);
    margin-bottom: 4px;
  }
  
  .sidebar-header p {
    font-size: 12px;
    color: var(--text-muted);
  }
  
  /* Scrollable Settings */
  .settings-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
  }
  
  .form-section {
    margin-bottom: 24px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }
  
  .form-section:last-of-type { border-bottom: none; }
  
  .section-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  
  .form-group {
    margin-bottom: 12px;
  }
  
  .form-group label {
    display: block;
    font-size: 13px;
    margin-bottom: 6px;
    color: var(--text-muted);
  }
  
  .form-group input,
  .form-group textarea,
  .form-group select {
    width: 100%;
    padding: 10px 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 14px;
    transition: border-color 0.2s;
  }
  
  .form-group input:focus,
  .form-group textarea:focus {
    outline: none;
    border-color: var(--primary);
  }
  
  .form-group textarea {
    min-height: 60px;
    resize: vertical;
  }
  
  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  
  /* Portal Cards Edit */
  .portal-item {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 12px;
  }
  
  .portal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  
  .portal-title {
    font-size: 13px;
    font-weight: 600;
  }
  
  .btn-remove {
    background: #ef4444;
    color: white;
    border: none;
    padding: 4px 10px;
    border-radius: 4px;
    font-size: 12px;
    cursor: pointer;
  }
  
  /* Stats Items */
  .stat-item-edit {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
    align-items: center;
  }
  
  .stat-item-edit input {
    flex: 1;
  }
  
  /* Buttons in Sidebar */
  .sidebar-footer {
    padding: 20px;
    border-top: 1px solid var(--border);
    background: var(--surface);
  }
  
  .btn {
    padding: 12px 24px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    width: 100%;
    margin-bottom: 8px;
  }
  
  .btn-primary {
    background: var(--primary);
    color: white;
  }
  
  .btn-primary:hover {
    opacity: 0.9;
    transform: translateY(-1px);
  }
  
  .btn-secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
  }
  
  .btn-secondary:hover {
    background: var(--bg);
  }
  
  .btn-success {
    background: #22c55e;
    color: white;
  }
  
  /* Preview Area */
  .preview-area {
    background: #000;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  
  .preview-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 24px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  
  .preview-header h2 {
    font-size: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  
  .device-toggles {
    display: flex;
    gap: 8px;
  }
  
  .device-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
  }
  
  .device-btn.active {
    background: var(--primary);
    border-color: var(--primary);
    color: white;
  }
  
  .preview-iframe-container {
    flex: 1;
    padding: 20px;
    overflow: auto;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #1a1a1a;
  }
  
  .preview-frame {
    background: white;
    border-radius: 8px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    overflow: hidden;
    transition: width 0.3s ease;
  }
  
  .preview-frame.desktop {
    width: 100%;
    height: calc(100% - 20px);
    max-width: 1400px;
  }
  
  .preview-frame.tablet {
    width: 768px;
    height: 1024px;
  }
  
  .preview-frame.mobile {
    width: 375px;
    height: 812px;
  }
  
  iframe {
    width: 100%;
    height: 100%;
    border: none;
  }
  
  .preview-info {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: var(--surface);
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 12px;
    color: var(--text-muted);
    border: 1px solid var(--border);
  }
  
  /* Checkbox styling */
  .checkbox-label {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
  }
  
  .checkbox-label input[type="checkbox"] {
    width: auto;
  }
</style>
    <meta name="theme-color" content="#2196f3">
    <link rel="manifest" href="/lpage-gen/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">
</head>
<body>

<div class="app-container">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-header">
      <h1>🎨 Landing Page Generator</h1>
      <p>Create your custom landing page</p>
    </div>
    
    <div class="settings-scroll">
      <!-- Theme Section -->
      <div class="form-section">
        <div class="section-title">Theme Colors</div>
        <div class="form-row">
          <div class="form-group">
            <label>Primary Color</label>
            <input type="color" id="theme_primary" value="#1e40af">
          </div>
          <div class="form-group">
            <label>Accent Color</label>
            <input type="color" id="theme_accent" value="#3b82f6">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Background Color</label>
            <input type="color" id="theme_dark" value="#0f172a">
          </div>
          <div class="form-group">
            <label>Border Radius</label>
            <input type="text" id="theme_radius" value="16px" placeholder="16px">
          </div>
        </div>
      </div>
      
      <!-- Organization Section -->
      <div class="form-section">
        <div class="section-title">Organization</div>
        <div class="form-group">
          <label>Organization Name</label>
          <input type="text" id="org_name" value="Food Order" placeholder="Your organization name">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Logo Initial</label>
            <input type="text" id="org_logo_text" value="F" maxlength="2" placeholder="Initial">
          </div>
          <div class="form-group">
            <label><label class="checkbox-label">
              <input type="checkbox" id="enable_particles" checked> Particles
            </label></label>
          </div>
        </div>
        <div class="form-group">
          <label>Or Logo Image URL (optional)</label>
          <input type="text" id="org_logo_img" placeholder="https://...">
        </div>
      </div>
      
      <!-- Background Section -->
      <div class="form-section">
        <div class="section-title">Background</div>
        <div class="form-group">
          <label>Background Image URL</label>
          <input type="text" id="bg_url" value="https://images.unsplash.com/photo-1504674900247-0877df9cc836" placeholder="Image URL">
        </div>
        <div class="form-group">
          <label>Overlay Opacity</label>
          <input type="number" id="bg_opacity" value="0.3" step="0.1" min="0" max="1">
        </div>
      </div>
      
      <!-- Hero Content -->
      <div class="form-section">
        <div class="section-title">Hero Content</div>
        <div class="form-group">
          <label>Title</label>
          <textarea id="hero_title" rows="2">Welcome to Our Food Ordering Service</textarea>
        </div>
        <div class="form-group">
          <label>Subtitle</label>
          <textarea id="hero_subtitle" rows="2">Order delicious food from the best local restaurants.</textarea>
        </div>
        <div class="form-group">
          <label>Page Title (Browser Tab)</label>
          <input type="text" id="meta_title" value="Food Ordering" placeholder="Page title">
        </div>
      </div>
      
      <!-- Portals Section -->
      <div class="form-section">
        <div class="section-title">Portal Cards</div>
        <div id="portals_container"></div>
        <button class="btn btn-secondary" onclick="addPortal()" style="margin-top:10px;">+ Add Portal</button>
      </div>
      
      <!-- Stats Section -->
      <div class="form-section">
        <div class="section-title">Stats Bar</div>
        <div id="stats_container"></div>
        <button class="btn btn-secondary" onclick="addStat()" style="margin-top:10px;">+ Add Stat</button>
      </div>
      
      <!-- Footer & Language -->
      <div class="form-section">
        <div class="section-title">Footer & Language</div>
        <div class="form-group">
          <label>Footer Text</label>
          <input type="text" id="footer_text" value="© 2026 Food Order Inc." placeholder="Footer text">
        </div>
        <div class="form-group">
          <label>Default Language</label>
          <select id="default_lang">
            <option value="en">English (LTR)</option>
            <option value="ar">Arabic (RTL)</option>
          </select>
        </div>
      </div>
    </div>
    
    <div class="sidebar-footer">
      <button class="btn btn-success" onclick="downloadHTML()">⬇️ Download landingpage.html</button>
    </div>
  </div>
  
  <!-- Preview Area -->
  <div class="preview-area">
    <div class="preview-header">
      <h2>📱 Live Preview</h2>
      <div class="device-toggles">
        <button class="device-btn active" onclick="setDevice('desktop')" data-device="desktop">Desktop</button>
        <button class="device-btn" onclick="setDevice('tablet')" data-device="tablet">Tablet</button>
        <button class="device-btn" onclick="setDevice('mobile')" data-device="mobile">Mobile</button>
      </div>
    </div>
    <div class="preview-iframe-container">
      <div class="preview-frame desktop" id="preview_frame">
        <iframe srcdoc="<html><body style='background:#1a1a1a;color:#fff;display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;'>Loading...
<script>if('serviceWorker' in navigator)window.addEventListener('load',()=>{navigator.serviceWorker.register('/lpage-gen/sw.js').then(r=>console.log('SW registered:',r)).catch(e=>console.error('SW registration failed:',e))})</script>
</body></html>"></iframe>
      </div>
    </div>
    <div class="preview-info">Auto-updates as you edit • Click Download when ready</div>
  </div>
</div>

<script>
// Default Settings
let settings = {
  meta: { title: "Food Ordering", description: "Order delicious food from local restaurants" },
  theme: {
    colors: { primary: "#1e40af", accent: "#3b82f6", dark: "#0f172a", light: "#f8fafc" },
    borderRadius: "16px",
    enableParticles: true
  },
  background: { url: "https://images.unsplash.com/photo-1504674900247-0877df9cc836", overlayOpacity: 0.3 },
  organization: { name: "Food Order", logo: { type: "text", value: "F", imageUrl: "" } },
  content: {
    hero: { title: "Welcome to Our Food Ordering Service", subtitle: "Order delicious food from the best local restaurants." },
    portals: [
      { id: "customer", enabled: true, icon: "customer", title: "Order Food", description: "Browse menus and place your order.", buttonText: "Order Now", url: "https://food-order-worker.yabaggi.workers.dev/", style: "primary" },
      { id: "admin", enabled: true, icon: "admin", title: "Admin Portal", description: "Manage restaurants, orders, and settings.", buttonText: "Sign In", url: "https://food-order-worker.yabaggi.workers.dev/admin", style: "secondary" }
    ],
    stats: [
      { value: "Fast", label: "Delivery" },
      { value: "Easy", label: "Ordering" },
      { value: "1000+", label: "Dishes" },
      { value: "Secure", label: "Payment" }
    ],
    footer: "© 2026 Food Order Inc."
  },
  i18n: { defaultLanguage: "en", supportedLanguages: ["en", "ar"], translations: {} }
};

// SVG Icons
const portalIcons = {
  customer: '<svg width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m22 4-10 10.01L8 11"/></svg>',
  admin: '<svg width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/><circle cx="12" cy="16" r="1"/></svg>'
};

// Initialize Form
function initForm() {
  document.getElementById('meta_title').value = settings.meta.title;
  document.getElementById('theme_primary').value = settings.theme.colors.primary;
  document.getElementById('theme_accent').value = settings.theme.colors.accent;
  document.getElementById('theme_dark').value = settings.theme.colors.dark;
  document.getElementById('theme_radius').value = settings.theme.borderRadius;
  document.getElementById('bg_url').value = settings.background.url;
  document.getElementById('bg_opacity').value = settings.background.overlayOpacity;
  document.getElementById('enable_particles').checked = settings.theme.enableParticles;
  document.getElementById('org_name').value = settings.organization.name;
  document.getElementById('org_logo_text').value = settings.organization.logo.value;
  document.getElementById('org_logo_img').value = settings.organization.logo.imageUrl || "";
  document.getElementById('hero_title').value = settings.content.hero.title;
  document.getElementById('hero_subtitle').value = settings.content.hero.subtitle;
  document.getElementById('footer_text').value = settings.content.footer;
  document.getElementById('default_lang').value = settings.i18n.defaultLanguage;
  
  renderPortals();
  renderStats();
  generatePreview();
}

// Render Portals
function renderPortals() {
  const container = document.getElementById('portals_container');
  container.innerHTML = '';
  
  settings.content.portals.forEach((portal, index) => {
    const div = document.createElement('div');
    div.className = 'portal-item';
    div.innerHTML = `
      <div class="portal-header">
        <span class="portal-title">${portal.id}</span>
        ${settings.content.portals.length > 1 ? `<button class="btn-remove" onclick="removePortal(${index})">✕</button>` : ''}
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Title</label>
          <input type="text" value="${portal.title}" onchange="updatePortal(${index}, 'title', this.value)">
        </div>
        <div class="form-group">
          <label>Icon Type</label>
          <select onchange="updatePortal(${index}, 'icon', this.value)">
            <option ${portal.icon === 'customer' ? 'selected' : ''}>Customer</option>
            <option ${portal.icon === 'admin' ? 'selected' : ''}>Admin</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea onchange="updatePortal(${index}, 'description', this.value)" rows="2">${portal.description}</textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Button Text</label>
          <input type="text" value="${portal.buttonText}" onchange="updatePortal(${index}, 'buttonText', this.value)">
        </div>
        <div class="form-group">
          <label>Style</label>
          <select onchange="updatePortal(${index}, 'style', this.value)">
            <option ${portal.style === 'primary' ? 'selected' : ''}>Primary</option>
            <option ${portal.style === 'secondary' ? 'selected' : ''}>Secondary</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>URL</label>
        <input type="text" value="${portal.url}" onchange="updatePortal(${index}, 'url', this.value)">
      </div>
    `;
    container.appendChild(div);
  });
}

// Render Stats
function renderStats() {
  const container = document.getElementById('stats_container');
  container.innerHTML = '';
  
  settings.content.stats.forEach((stat, index) => {
    const div = document.createElement('div');
    div.className = 'stat-item-edit';
    div.innerHTML = `
      <input type="text" value="${stat.value}" placeholder="Value" onchange="updateStat(${index}, 'value', this.value)">
      <input type="text" value="${stat.label}" placeholder="Label" onchange="updateStat(${index}, 'label', this.value)">
      ${settings.content.stats.length > 1 ? `<button class="btn-remove" onclick="removeStat(${index})">✕</button>` : ''}
    `;
    container.appendChild(div);
  });
}

// CRUD Operations
function addPortal() {
  settings.content.portals.push({
    id: "portal_" + Date.now(),
    enabled: true,
    icon: "customer",
    title: "New Portal",
    description: "Description goes here",
    buttonText: "Get Started",
    url: "#",
    style: "primary"
  });
  renderPortals();
  generatePreview();
}

function removePortal(index) {
  if (settings.content.portals.length > 1) {
    settings.content.portals.splice(index, 1);
    renderPortals();
    generatePreview();
  }
}

function updatePortal(index, field, value) {
  settings.content.portals[index][field] = value;
  generatePreview();
}

function addStat() {
  settings.content.stats.push({ value: "New", label: "Statistic" });
  renderStats();
  generatePreview();
}

function removeStat(index) {
  if (settings.content.stats.length > 1) {
    settings.content.stats.splice(index, 1);
    renderStats();
    generatePreview();
  }
}

function updateStat(index, field, value) {
  settings.content.stats[index][field] = value;
  generatePreview();
}

// Device Preview Toggle
function setDevice(device) {
  const frame = document.getElementById('preview_frame');
  const buttons = document.querySelectorAll('.device-btn');
  
  buttons.forEach(btn => {
    btn.classList.toggle('active', btn.dataset.device === device);
  });
  
  frame.className = `preview-frame ${device}`;
}

// Generate Full HTML
function generateHTML() {
  return `<!DOCTYPE html>
<html lang="${settings.i18n.defaultLanguage}" dir="${settings.i18n.defaultLanguage === 'ar' ? 'rtl' : 'ltr'}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>${settings.meta.title}</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{
    --primary:${settings.theme.colors.primary};--accent:${settings.theme.colors.accent};--dark:${settings.theme.colors.dark};--light:${settings.theme.colors.light};
    --radius:${settings.theme.borderRadius};--shadow:0 20px 60px rgba(0,0,0,0.15);
  }
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--dark);color:#fff;min-height:100vh;overflow-x:hidden;}
  html[dir="rtl"] body{font-family:'Segoe UI',Tahoma,'Noto Sans Arabic','Droid Arabic Kufi',sans-serif;}
  html[dir="rtl"] .card-btn svg{transform:rotate(180deg);}
  .lang-toggle{position:fixed;top:20px;right:20px;z-index:100;display:flex;background:rgba(255,255,255,0.08);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.12);border-radius:30px;overflow:hidden;animation:fadeDown 0.8s ease;}
  html[dir="rtl"] .lang-toggle{right:auto;left:20px;}
  .lang-btn{padding:8px 18px;font-size:13px;font-weight:600;border:none;cursor:pointer;background:transparent;color:rgba(255,255,255,0.5);transition:all 0.3s;letter-spacing:0.5px;}
  .lang-btn.active{background:rgba(255,255,255,0.15);color:#fff;}
  .lang-btn:hover:not(.active){color:rgba(255,255,255,0.8);}
  .hero{position:relative;min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:40px 20px;overflow:hidden;}
  .hero-bg{position:absolute;inset:0;z-index:0;}
  .hero-bg img{width:100%;height:100%;object-fit:cover;opacity:${settings.background.overlayOpacity};}
  .hero-bg-gradient{position:absolute;inset:0;background:radial-gradient(ellipse at 20% 50%, rgba(30,64,175,0.4) 0%, transparent 60%),radial-gradient(ellipse at 80% 20%, rgba(59,130,246,0.3) 0%, transparent 50%),radial-gradient(ellipse at 50% 100%, rgba(15,23,42,0.9) 0%, transparent 60%),linear-gradient(180deg, rgba(15,23,42,0.7) 0%, rgba(15,23,42,0.4) 40%, rgba(15,23,42,0.8) 100%);z-index:1;}
  .hero-content{position:relative;z-index:2;max-width:800px;width:100%;}
  .org-badge{display:inline-flex;align-items:center;gap:12px;background:rgba(255,255,255,0.08);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.12);border-radius:60px;padding:10px 24px 10px 14px;margin-bottom:32px;animation:fadeDown 0.8s ease;}
  html[dir="rtl"] .org-badge{padding:10px 14px 10px 24px;}
  .org-logo{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,0.2);}
  .org-logo-placeholder{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#fff;flex-shrink:0;}
  .org-name{font-size:15px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;color:rgba(255,255,255,0.9);}
  html[dir="rtl"] .org-name{letter-spacing:0;}
  .hero-title{font-size:clamp(32px,6vw,56px);font-weight:800;line-height:1.15;margin-bottom:20px;background:linear-gradient(135deg,#fff 30%,rgba(147,197,253,0.9));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:fadeDown 0.8s ease 0.15s both;}
  html[dir="rtl"] .hero-title{line-height:1.4;}
  .hero-subtitle{font-size:clamp(16px,2.5vw,20px);color:rgba(255,255,255,0.65);line-height:1.6;max-width:600px;margin:0 auto 16px;animation:fadeDown 0.8s ease 0.3s both;}
  html[dir="rtl"] .hero-subtitle{line-height:1.8;}
  .cards-container{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;margin-top:40px;animation:fadeUp 0.8s ease 0.5s both;}
  .portal-card{background:rgba(255,255,255,0.06);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.1);border-radius:var(--radius);padding:36px 32px;width:300px;text-align:center;cursor:pointer;transition:all 0.3s ease;position:relative;overflow:hidden;}
  .portal-card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,transparent,rgba(59,130,246,0.08));opacity:0;transition:opacity 0.3s;}
  .portal-card:hover{transform:translateY(-6px);border-color:rgba(59,130,246,0.4);box-shadow:0 20px 50px rgba(59,130,246,0.15);}
  .portal-card:hover::before{opacity:1;}
  .card-icon{width:64px;height:64px;border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:28px;position:relative;}
  .card-icon.customer{background:linear-gradient(135deg,rgba(59,130,246,0.2),rgba(99,102,241,0.2));color:#60a5fa;}
  .card-icon.admin{background:linear-gradient(135deg,rgba(168,85,247,0.2),rgba(236,72,153,0.2));color:#c084fc;}
  .card-title{font-size:20px;font-weight:700;margin-bottom:10px;color:#fff;}
  .card-desc{font-size:14px;color:rgba(255,255,255,0.5);line-height:1.5;margin-bottom:24px;}
  .card-btn{display:inline-flex;align-items:center;gap:8px;padding:12px 28px;border-radius:30px;font-size:15px;font-weight:600;border:none;cursor:pointer;transition:all 0.3s;text-decoration:none;}
  .card-btn.primary-btn{background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;}
  .card-btn.primary-btn:hover{box-shadow:0 8px 30px rgba(59,130,246,0.4);transform:translateY(-2px);}
  .card-btn.secondary-btn{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);color:rgba(255,255,255,0.8);}
  .card-btn.secondary-btn:hover{background:rgba(255,255,255,0.15);color:#fff;}
  .stats-bar{display:flex;gap:40px;justify-content:center;flex-wrap:wrap;margin-top:56px;padding-top:40px;border-top:1px solid rgba(255,255,255,0.08);animation:fadeUp 0.8s ease 0.7s both;}
  .stat-item{text-align:center;}
  .stat-number{font-size:28px;font-weight:800;background:linear-gradient(135deg,#60a5fa,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
  .stat-label{font-size:13px;color:rgba(255,255,255,0.4);margin-top:4px;text-transform:uppercase;letter-spacing:1px;}
  html[dir="rtl"] .stat-label{letter-spacing:0;}
  .footer{position:relative;z-index:2;text-align:center;padding:24px 20px;color:rgba(255,255,255,0.3);font-size:13px;}
  .particles{position:absolute;inset:0;z-index:1;overflow:hidden;pointer-events:none;}
  .particle{position:absolute;width:3px;height:3px;background:rgba(255,255,255,0.15);border-radius:50%;animation:float linear infinite;}
  @keyframes fadeDown{from{opacity:0;transform:translateY(-20px);}to{opacity:1;transform:translateY(0);}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
  @keyframes float{0%{transform:translateY(100vh) rotate(0deg);opacity:0;}10%{opacity:1;}90%{opacity:1;}100%{transform:translateY(-10vh) rotate(720deg);opacity:0;}}
  @media(max-width:680px){.cards-container{flex-direction:column;align-items:center;}.portal-card{width:100%;max-width:340px;}.stats-bar{gap:24px;}.stat-number{font-size:24px;}.lang-toggle{top:12px;right:12px;}html[dir="rtl"] .lang-toggle{right:auto;left:12px;}}
</style>
</head>
<body>
<div class="lang-toggle">
  <button class="lang-btn active" id="langEN" onclick="switchLang('en')">EN</button>
  <button class="lang-btn" id="langAR" onclick="switchLang('ar')">عربي</button>
</div>
<div class="hero">
  <div class="hero-bg">
    <img src="${settings.background.url}" alt="" style="display:block;">
    <div class="hero-bg-gradient"></div>
  </div>
${settings.theme.enableParticles ? '<div class="particles" id="particles"></div>\n' : ''}
  <div class="hero-content">
    <div class="org-badge">
${settings.organization.logo.imageUrl ? `      <img src="${settings.organization.logo.imageUrl}" class="org-logo" alt="">\n` : `      <div class="org-logo-placeholder">${settings.organization.logo.value}</div>\n`}
      <span class="org-name">${settings.organization.name}</span>
    </div>
    <h1 class="hero-title" id="heroTitle">${settings.content.hero.title}</h1>
    <p class="hero-subtitle" id="heroSubtitle">${settings.content.hero.subtitle}</p>
    <div class="cards-container">
${settings.content.portals.filter(p => p.enabled).map(portal => `
      <div class="portal-card" onclick="window.location.href='${portal.url}'">
        <div class="card-icon ${portal.icon}">
          ${portalIcons[portal.icon]}
        </div>
        <h3 class="card-title">${portal.title}</h3>
        <p class="card-desc">${portal.description}</p>
        <span class="card-btn ${portal.style}-btn">
          <span>${portal.buttonText}</span>
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </span>
      </div>`).join('\n')}
    </div>
    <div class="stats-bar">
${settings.content.stats.map(stat => `
      <div class="stat-item">
        <div class="stat-number">${stat.value}</div>
        <div class="stat-label">${stat.label}</div>
      </div>`).join('\n')}
    </div>
  </div>
  <div class="footer">${settings.content.footer}</div>
</div>
<script>
  function switchLang(lang) {
    document.getElementById('langEN').classList.toggle('active', lang === 'en');
    document.getElementById('langAR').classList.toggle('active', lang === 'ar');
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.documentElement.lang = lang;
  }
  function createParticles() {
    var container = document.getElementById('particles');
    if (!container) return;
    for (var i = 0; i < 30; i++) {
      var p = document.createElement('div');
      p.className = 'particle';
      p.style.left = Math.random() * 100 + '%';
      p.style.animationDuration = (8 + Math.random() * 15) + 's';
      p.style.animationDelay = (Math.random() * 10) + 's';
      p.style.width = p.style.height = (2 + Math.random() * 3) + 'px';
      container.appendChild(p);
    }
  }
  document.addEventListener('DOMContentLoaded', function() {
${settings.theme.enableParticles ? '    createParticles();' : ''}
  });
<\/script>
</body>
</html>`;
}

// Update Preview
function generatePreview() {
  // Collect form values first
  settings.meta.title = document.getElementById('meta_title').value;
  settings.theme.colors.primary = document.getElementById('theme_primary').value;
  settings.theme.colors.accent = document.getElementById('theme_accent').value;
  settings.theme.colors.dark = document.getElementById('theme_dark').value;
  settings.theme.borderRadius = document.getElementById('theme_radius').value;
  settings.background.url = document.getElementById('bg_url').value;
  settings.background.overlayOpacity = parseFloat(document.getElementById('bg_opacity').value);
  settings.theme.enableParticles = document.getElementById('enable_particles').checked;
  settings.organization.name = document.getElementById('org_name').value;
  settings.organization.logo.value = document.getElementById('org_logo_text').value;
  settings.organization.logo.imageUrl = document.getElementById('org_logo_img').value.trim();
  settings.content.hero.title = document.getElementById('hero_title').value;
  settings.content.hero.subtitle = document.getElementById('hero_subtitle').value;
  settings.content.footer = document.getElementById('footer_text').value;
  settings.i18n.defaultLanguage = document.getElementById('default_lang').value;
  
  const html = generateHTML();
  const iframe = document.getElementById('preview_frame').querySelector('iframe');
  iframe.srcdoc = html;
}

// Download HTML
function downloadHTML() {
  const html = generateHTML();
  const blob = new Blob([html], {type: 'text/html'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'landingpage.html';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// Auto-update on input change
document.addEventListener('DOMContentLoaded', () => {
  initForm();
  
  document.querySelectorAll('input, textarea, select').forEach(el => {
    el.addEventListener('change', generatePreview);
  });
});
</script>

</body>
</html>
